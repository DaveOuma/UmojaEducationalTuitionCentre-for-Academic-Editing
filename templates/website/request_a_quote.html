{% extends "base.html" %}
{% block title %}Request a Quote | {{ service_brand_name }}{% endblock %}
{% block content %}
<section>
    <h1>Request a Quote</h1>
    <p class="lede">Tell us about your manuscript and we'll get back to you.</p>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Send Inquiry</button>
    </form>
</section>
{% endblock %}
